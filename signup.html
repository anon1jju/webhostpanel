<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link as="style" href="https://fonts.googleapis.com/css2?display=swap&amp;family=Inter:wght@400;500;600;700&amp;family=Noto+Sans:wght@400;500;700;900" onload="this.rel='stylesheet'" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style type="text/tailwindcss">
        :root {
            --primary-50: #eef7ff;
            --primary-100: #d9edff;
            --primary-200: #bce1ff;
            --primary-300: #8ed0ff;
            --primary-400: #5ab8ff;
            --primary-500: #309eff;
            --primary-600: #0d7ff2;
            --primary-700: #0269d3;
            --primary-800: #0355ad;
            --primary-900: #06478a;
            --primary-950: #0b2d54;
        }
    </style>
<title>Admin Panel - Sign Up</title>
<link href="data:image/x-icon;base64," rel="icon" type="image/x-icon"/>
</head>
<body class="bg-gray-50 dark:bg-gray-900">
<div class="flex min-h-screen flex-col items-center justify-center px-6 py-8" style='font-family: Inter, "Noto Sans", sans-serif;'>
<a class="mb-6 flex items-center gap-3 text-2xl font-semibold text-gray-900 dark:text-white" href="#">
<div class="flex h-8 w-8 items-center justify-center rounded-md bg-[var(--primary-600)] text-white">
<svg class="h-5 w-5" fill="none" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
<path d="M42.4379 44C42.4379 44 36.0744 33.9038 41.1692 24C46.8624 12.9336 42.2078 4 42.2078 4L7.01134 4C7.01134 4 11.6577 12.932 5.96912 23.9969C0.876273 33.9029 7.27094 44 7.27094 44L42.4379 44Z" fill="currentColor"></path>
</svg>
</div>
<span class="font-bold">Admin Panel</span>
</a>
<div class="w-full rounded-lg bg-white shadow-md dark:border dark:border-gray-700 dark:bg-gray-800 sm:max-w-md md:mt-0 xl:p-0">
<div class="space-y-4 p-6 sm:p-8 md:space-y-6">
<h1 class="text-xl font-bold leading-tight tracking-tight text-gray-900 dark:text-white md:text-2xl">Create an account</h1>
<form action="#" class="space-y-4 md:space-y-6">
<div>
<label class="mb-2 block text-sm font-medium text-gray-900 dark:text-white" for="email">Your email</label>
<input class="form-input block w-full rounded-md border border-gray-300 bg-gray-50 p-2.5 text-gray-900 focus:border-[var(--primary-600)] focus:ring-[var(--primary-600)] dark:border-gray-600 dark:bg-gray-700 dark:text-white dark:placeholder-gray-400 dark:focus:border-blue-500 dark:focus:ring-blue-500 sm:text-sm" id="email" name="email" placeholder="name@company.com" required="" type="email"/>
</div>
<div>
<label class="mb-2 block text-sm font-medium text-gray-900 dark:text-white" for="password">Password</label>
<input class="form-input block w-full rounded-md border border-gray-300 bg-gray-50 p-2.5 text-gray-900 focus:border-[var(--primary-600)] focus:ring-[var(--primary-600)] dark:border-gray-600 dark:bg-gray-700 dark:text-white dark:placeholder-gray-400 dark:focus:border-blue-500 dark:focus:ring-blue-500 sm:text-sm" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
<div>
<label class="mb-2 block text-sm font-medium text-gray-900 dark:text-white" for="confirm-password">Confirm password</label>
<input class="form-input block w-full rounded-md border border-gray-300 bg-gray-50 p-2.5 text-gray-900 focus:border-[var(--primary-600)] focus:ring-[var(--primary-600)] dark:border-gray-600 dark:bg-gray-700 dark:text-white dark:placeholder-gray-400 dark:focus:border-blue-500 dark:focus:ring-blue-500 sm:text-sm" id="confirm-password" name="confirm-password" placeholder="••••••••" required="" type="password"/>
</div>
<div class="flex items-start">
<div class="flex h-5 items-center">
<input aria-describedby="terms" class="form-checkbox h-4 w-4 rounded border border-gray-300 bg-gray-50 text-[var(--primary-600)] focus:ring-3 focus:ring-[var(--primary-300)] dark:border-gray-600 dark:bg-gray-700 dark:ring-offset-gray-800 dark:focus:ring-[var(--primary-600)]" id="terms" required="" type="checkbox"/>
</div>
<div class="ml-3 text-sm">
<label class="font-light text-gray-500 dark:text-gray-300" for="terms">I accept the <a class="font-medium text-[var(--primary-600)] hover:underline dark:text-[var(--primary-500)]" href="#">Terms and Conditions</a></label>
</div>
</div>
<button class="w-full rounded-md bg-[var(--primary-600)] px-5 py-2.5 text-center text-sm font-medium text-white hover:bg-[var(--primary-700)] focus:outline-none focus:ring-4 focus:ring-[var(--primary-300)] dark:bg-[var(--primary-600)] dark:hover:bg-[var(--primary-700)] dark:focus:ring-[var(--primary-800)]" type="submit">
                        Create an account
                    </button>
<p class="text-sm font-light text-gray-500 dark:text-gray-400">
                        Already have an account?
                        <a class="font-medium text-[var(--primary-600)] hover:underline dark:text-[var(--primary-500)]" href="#">Login here</a>
</p>
</form>
</div>
</div>
</div>

</body></html>
