<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link href="data:image/x-icon;base64," rel="icon" type="image/x-icon" />
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <style type="text/tailwindcss">
        :root {
            --primary-color: #0d7ff2;
            --background-color: #f8fafc;
            --card-background-color: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--background-color);
        }
    </style>
</head>
<body>
    <div class="flex min-h-screen items-center justify-center bg-[var(--background-color)] p-4 sm:p-6 lg:p-8">
        <div class="w-full max-w-md space-y-6">
            <div>
                <div class="mx-auto flex h-12 w-12 items-center justify-center">
                    <svg class="h-8 w-8 text-[var(--primary-color)]" fill="none" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                        <path d="M42.4379 44C42.4379 44 36.0744 33.9038 41.1692 24C46.8624 12.9336 42.2078 4 42.2078 4L7.01134 4C7.01134 4 11.6577 12.932 5.96912 23.9969C0.876273 33.9029 7.27094 44 7.27094 44L42.4379 44Z" fill="currentColor"></path>
                    </svg>
                </div>
                <h2 class="mt-6 text-center text-2xl font-bold tracking-tight text-[var(--text-primary)] sm:text-3xl">Forgot your password?</h2>
                <p class="mt-2 text-center text-sm text-[var(--text-secondary)]">
                    No worries, we'll send you reset instructions.
                </p>
            </div>
            <div class="rounded-lg bg-[var(--card-background-color)] p-6 shadow-sm sm:p-8">
                <form action="#" class="space-y-6" method="POST">
                    <div>
                        <label class="sr-only" for="email">Email address</label>
                        <input autocomplete="email" class="relative block w-full appearance-none rounded-md border border-[var(--border-color)] px-3 py-3 text-[var(--text-primary)] placeholder-[var(--text-secondary)] focus:z-10 focus:border-[var(--primary-color)] focus:outline-none focus:ring-[var(--primary-color)] sm:text-sm" id="email" name="email" placeholder="Enter your email address" required="" type="email" />
                    </div>
                    <div>
                        <button class="group relative flex w-full justify-center rounded-md border border-transparent bg-[var(--primary-color)] px-4 py-3 text-sm font-semibold text-white hover:bg-opacity-90 focus:outline-none focus:ring-2 focus:ring-[var(--primary-color)] focus:ring-offset-2" type="submit">
                            Send Reset Link
                        </button>
                    </div>
                </form>
                <div class="mt-6 text-center">
                    <a class="text-sm font-medium text-[var(--primary-color)] hover:text-opacity-80" href="#">
                        <span class="inline-flex items-center">
                            <svg class="mr-1 h-4 w-4" fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="16" xmlns="http://www.w3.org/2000/svg">
                                <path d="M15 18l-6-6 6-6"></path>
                            </svg>
                            Back to Sign In
                        </span>
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
